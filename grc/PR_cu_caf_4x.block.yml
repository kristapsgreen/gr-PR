id: PR_cu_caf_4x
label: CuPy CAF 4x
category: '[PR]'

templates:
  imports: from gnuradio.PR import cu_caf_4x
  make: |
    cu_caf_4x(
        cpi_samp=${cpi_samp},
        num_doppler_bins=${num_doppler_bins},
        num_delay_bins=${num_delay_bins},
        cpi_skip=${cpi_skip},
        sample_rate=${sample_rate},
        max_doppler=${max_doppler},
    )
  callbacks:
    - set_cpi_skip(${cpi_skip})

parameters:
  - id: cpi_samp
    label: CPI Samples
    dtype: int
    default: '24000'

  - id: num_doppler_bins
    label: Doppler Bins
    dtype: int
    default: '128'

  - id: num_delay_bins
    label: Delay Bins
    dtype: int
    default: '128'

  - id: cpi_skip
    label: CPI Skip (1=all)
    dtype: int
    default: '1'

  - id: sample_rate
    label: Sample Rate (Hz)
    dtype: float
    default: 'samp_rate'

  - id: max_doppler
    label: Max Doppler (Hz)
    dtype: float
    default: '1000.0'

inputs:
  - label: ref
    dtype: complex
    vlen: ${cpi_samp}

  - label: surv1
    dtype: complex
    vlen: ${cpi_samp}

  - label: surv2
    dtype: complex
    vlen: ${cpi_samp}

  - label: surv3
    dtype: complex
    vlen: ${cpi_samp}

  - label: surv4
    dtype: complex
    vlen: ${cpi_samp}

outputs:
  - label: caf_out1
    dtype: complex
    vlen: ${num_doppler_bins * num_delay_bins}

  - label: caf_out2
    dtype: complex
    vlen: ${num_doppler_bins * num_delay_bins}

  - label: caf_out3
    dtype: complex
    vlen: ${num_doppler_bins * num_delay_bins}

  - label: caf_out4
    dtype: complex
    vlen: ${num_doppler_bins * num_delay_bins}

documentation: |-
    Cross Ambiguity Function, 4-channel (CAF 4x) — gr-PR  [CuPy GPU]

    GPU-accelerated 4-channel CAF block. Accepts one reference signal and
    four surveillance signals per CPI, and emits four independent CAF matrices.

    The Doppler-shifted reference FFTs are computed ONCE per CPI and shared
    across all four surveillance correlations, saving approximately
    (num_doppler_bins × cpi_samp) complex multiplications and
    num_doppler_bins cuFFTs per CPI compared to four separate cu_caf blocks.

    INPUTS
      ref   (port 0) : complex vector, len = cpi_samp — reference channel
      surv1 (port 1) : complex vector, len = cpi_samp — surveillance channel 1
      surv2 (port 2) : complex vector, len = cpi_samp — surveillance channel 2
      surv3 (port 3) : complex vector, len = cpi_samp — surveillance channel 3
      surv4 (port 4) : complex vector, len = cpi_samp — surveillance channel 4

    OUTPUTS (one per surveillance channel)
      Flattened complex64 CAF matrix: num_doppler_bins x num_delay_bins
      Row-major. Doppler axis centred (zero-Doppler at centre row).
      Phase preserved for downstream DOA processing across all 4 channels.

    PARAMETERS
      cpi_samp         — must match stream_to_vector length
      num_doppler_bins — Doppler resolution: more bins = finer resolution
      num_delay_bins   — Range resolution: max range = nl * c / (2 * fs)
      cpi_skip         — drop N-1 of every N CPIs to reduce GPU load
      sample_rate      — use the samp_rate variable from your flowgraph
      max_doppler      — maximum Doppler frequency shift in Hz

    REQUIRES: NVIDIA GPU with CuPy installed (pip install cupy-cuda12x)

file_format: 1
