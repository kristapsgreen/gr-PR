id: PR_DDC
label: DDC
category: '[PR]'

templates:
  imports: from gnuradio.PR import DDC
  make: |
    DDC(
        cpi_samp=${cpi_samp},
        num_taps=${num_taps},
        reg_mu=${reg_mu},
    )
  callbacks:
    - set_num_taps(${num_taps})
    - set_reg_mu(${reg_mu})

parameters:
  - id: cpi_samp
    label: CPI Samples
    dtype: int
    default: '24000'

  - id: num_taps
    label: Filter Taps (delays to cancel)
    dtype: int
    default: '128'

  - id: reg_mu
    label: Regularisation (μ)
    dtype: float
    default: '0.01'

inputs:
  - label: ref
    dtype: complex
    vlen: ${cpi_samp}

  - label: surv
    dtype: complex
    vlen: ${cpi_samp}

outputs:
  - label: ref
    dtype: complex
    vlen: ${cpi_samp}

  - label: surv_clean
    dtype: complex
    vlen: ${cpi_samp}

documentation: |-
    Direct-path Disturbance Cancellation (DDC) — gr-PR

    Removes direct-path signal and short-delay multipath clutter from the
    surveillance channel using the ECA batch Wiener filter.

    Place BETWEEN stream_to_vector and CAF:
        stream_to_vector → DDC → CAF

    Reference passes through unchanged; only surveillance is cleaned.

    INPUTS
      ref  (port 0) : complex vector, len = cpi_samp — reference channel
      surv (port 1) : complex vector, len = cpi_samp — surveillance channel

    OUTPUTS
      ref        (port 0) : reference pass-through (unchanged)
      surv_clean (port 1) : cleaned surveillance

    PARAMETERS
      cpi_samp   — must match stream_to_vector length
      num_taps   — number of FIR taps / delay bins to cancel.
                   Larger = deeper clutter removal but more CPU.
                   Start with 100–300 for DVB-T at 2.4 MHz.
      reg_mu     — Tikhonov regularisation (diagonal loading).
                   Stabilises the matrix inversion.
                   Typical: 0.001 to 1.0. Increase if artefacts appear.

file_format: 1
